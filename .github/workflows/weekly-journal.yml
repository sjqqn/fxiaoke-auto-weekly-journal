name: 周日志自动生成

# 注意：纷享 MCP（open.fxiaoke.com）对境外 IP 返回 404，
# GitHub Actions runner 跑在 Azure 美国节点，无法直接调用。
# 因此 schedule 已禁用，定时任务通过 macOS launchd 本地执行
# （见 launchd/install.sh）。此 workflow 仅保留手动触发通道，
# 用于代码 lint / 验证；如需在 CI 跑通需使用 self-hosted runner。

on:
  # 允许手动触发（仅作代码完整性验证；线上调用需国内 IP）
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run 模式（只查询归纳，不写入 CRM）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      override_end_time:
        description: '覆盖截止时间（留空则用当前时间，格式：2026-05-08T19:00:00+08:00）'
        required: false
        default: ''

jobs:
  generate-journal:
    name: 生成并写入周日志
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 执行周日志任务
        env:
          MCP_TOKEN:          ${{ secrets.MCP_TOKEN }}
          MINIMAX_API_KEY:    ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL:          ${{ vars.LLM_MODEL || '' }}
          OWNER_NAMES:        ${{ vars.OWNER_NAMES || '沈佳琪' }}
          REVIEWER_NAMES:     ${{ vars.REVIEWER_NAMES || '安春晖yak' }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node src/index.js --dry-run
          else
            node src/index.js
          fi

      - name: 任务失败通知（可选）
        if: failure()
        run: |
          echo "⚠️ 周日志生成失败，请检查日志"
          # 可在此添加钉钉/企微/飞书 webhook 通知
